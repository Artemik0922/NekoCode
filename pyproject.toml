[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nekocode"
version = "0.4.0"
description = "NekoCode — Claude Code аналог: агент кода с блюпринтами, техдолгом, постоянной памятью и русским интерфейсом"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
nekocode = "nekocode.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
]

[tool.setuptools]
packages = ["nekocode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
